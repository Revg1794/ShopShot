name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # The secrets context is not available in a step-level `if`, so the one value the release
    # steps branch on is lifted into the job environment here and tested as env instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopShot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Without the keystore secrets a release build would be signed with a throwaway debug key
      # generated on the runner, producing an APK that cannot update any real install. So the
      # release steps only run once the secrets are configured.
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shopshot-release.jks"
          echo "SHOPSHOT_STORE_FILE=$RUNNER_TEMP/shopshot-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and bundle
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          SHOPSHOT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHOPSHOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SHOPSHOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShopShot-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove decoded keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/shopshot-release.jks"
